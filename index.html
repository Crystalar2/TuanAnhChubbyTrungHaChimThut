<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Lịch sử 12</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d2433;--mute:#6a7385;--line:#d9d4c7;--acc:#8c2f39;--ok:#1f7a4d;--okb:#e0f3e8;--no:#b3261e;--nob:#fbe4e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--card:#1f242e;--ink:#eceef3;--mute:#9aa3b5;--line:#333b4a;--acc:#e08a93;--ok:#6fd3a0;--okb:#17372a;--no:#ff9a92;--nob:#40201e}}
:root[data-theme="dark"]{--bg:#15181f;--card:#1f242e;--ink:#eceef3;--mute:#9aa3b5;--line:#333b4a;--acc:#e08a93;--ok:#6fd3a0;--okb:#17372a;--no:#ff9a92;--nob:#40201e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:20px 0 4px;color:var(--acc)}
.mute{color:var(--mute);font-size:15px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.q b{display:block;margin-bottom:4px;color:var(--acc);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:active{transform:scale(.99)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}
.opt:disabled{cursor:default;opacity:1}
.tf{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.tf.ok{border-color:var(--ok)}.tf.no{border-color:var(--no)}
.tf p{margin:0 0 8px}
.row{display:flex;gap:8px}
.row button{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.row button.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:700}
.row button.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.res{margin-top:6px;font-size:15px;font-weight:700}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.main{display:block;width:100%;padding:14px;margin-top:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:17px}
:root[data-theme="dark"] .main,:root:not([data-theme="light"]) .main{color:#15181f}
.mode{display:block;width:100%;padding:14px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:left}
.score{font-size:48px;font-weight:700;color:var(--acc);margin:10px 0}
.hide{display:none}
</style></head><body><main id="app"></main>

["Đâu là một trong những nội dung của mục tiêu, hành động mang tính toàn cầu đến năm 2030 của Liên hợp quốc?",["Chống nạn thất nghiệp","Quyền tự do chính trị","Chống bạo lực gia đình","Chất lượng giáo dục"],3],

["Liên hợp quốc quyết định lấy ngày 24-10 hằng năm làm ngày Liên hợp quốc vì đó là ngày",["Kết thúc Chiến tranh lạnh","Bế mạc hội nghị I-an-ta","Hiến chương Liên hợp quốc có hiệu lực","Khai mạc lễ thành lập Liên hợp quốc"],2],
["Hội nghị I-an-ta (2/1945) được tiến hành trong giai đoạn nào của Chiến tranh thế giới thứ hai?",["Vừa mới kết thúc","Bùng nổ và lan rộng","Giai đoạn sắp kết thúc","Đang diễn ra ác liệt"],2],
["“Trật tự thế giới hai cực I-an-ta” sau Chiến tranh thế giới thứ hai do hai cường quốc nào chi phối?",["Mỹ và Đức","Mỹ và Anh","Mỹ và Trung Quốc","Mỹ và Liên Xô"],3],
["Quyết định nào sau đây KHÔNG phải của Hội nghị I-an-ta (2/1945)?",["Thành lập tổ chức quốc tế là Liên hợp quốc","Thống nhất tiêu diệt chủ nghĩa phát xít","Hình thành trật tự thế giới mới","Phân chia phạm vi ảnh hưởng"],2],

["Để tiêu diệt chủ nghĩa quân phiệt Nhật Bản và nhanh chóng kết thúc chiến tranh, hội nghị I-an-ta đã quyết định",["Anh, Pháp, Mỹ sẽ tham gia chiến tranh chống Nhật ở châu Âu","Anh và Liên Xô tiêu diệt lực lượng quân Nhật tại Trung Quốc","Liên Xô sẽ đánh Nhật ở châu Á sau khi đánh bại phát xít Đức","Liên Xô không đưa quân tham gia chống Nhật ở châu Á"],2],
["Một trong những khu vực được hội nghị I-an-ta (1945) quy định thuộc phạm vi ảnh hưởng của Liên Xô là",["Tây Âu","Đông Âu","Nhật Bản","Triều Tiên"],1],
["Một trong những khu vực được hội nghị I-an-ta (1945) quy định thuộc phạm vi ảnh hưởng của Mỹ là",["Tây Âu","Đông Âu","Mông Cổ","Trung Đông"],0],
["Liên Xô và Mỹ đẩy mạnh đối thoại hợp tác từ",["nửa sau những năm 80","nửa sau những năm 90","nửa đầu những năm 90","nửa đầu những năm 80"],0],
["Năm 1989, tại đảo Man-ta, Mỹ và Liên Xô đã có hành động nào sau đây?",["Tuyên bố chung về vũ khí chiến lược","Ký nhiều hiệp định thương mại tự do","Tuyên bố chấm dứt Chiến tranh lạnh","Cam kết hòa bình giữa Mỹ và Liên Xô"],2],

["Một trong những biểu hiện của xu thế Toàn cầu hóa là",["sự gia tăng của thương mại thế giới","xu thế hòa hoãn Đông, Tây thế kỷ XX","mâu thuẫn giữa hai siêu cường Xô, Mỹ","thế giới đã chia thành hai cực, hai phe"],0],

["Quốc gia nào sau đây là thành viên thứ 7 của Hiệp hội các quốc gia Đông Nam Á (ASEAN)?",["Việt Nam","Bru-nây","Campuchia","Indonesia"],0],
["Hiệp hội các quốc gia Đông Nam Á được thành lập vào thời gian nào và ở đâu?",["Tháng 8-1968, tại Gia-các-ta (In-đô-nê-xi-a)","Tháng 8-1968, tại Ba-li (In-đô-nê-xi-a)","Tháng 8-1967, tại Băng Cốc (Thái Lan)","Tháng 10-1967, tại Xin-ga-po"],2],

["Theo Tuyên bố Ba-li (1976), cơ chế hoạt động cao nhất của ASEAN được xác định tại",["Hội nghị Thượng đỉnh","Hội nghị Ngoại trưởng","Hội nghị Bộ trưởng quốc phòng","Hội nghị ASEAN+3"],0],

["Từ năm 2015 đến nay, thành lập và xây dựng Cộng đồng ASEAN KHÔNG nhằm lĩnh vực",["chính trị - an ninh","kinh tế","văn hóa – xã hội","an ninh quốc phòng"],3],
["Phát triển kinh tế đồng đều, giảm nghèo, thu hẹp khoảng cách về kinh tế - xã hội là nỗ lực của",["ASPC","AEC","ASEAN","ASCC"],1],
["Nội dung nào sau đây là điều kiện khách quan thuận lợi cho Cách mạng tháng Tám nổ ra?",["Chiến tranh thế giới thứ hai đã bùng nổ","phát xít Đức đầu hàng quân Đồng minh","Mỹ ném bom nguyên tử xuống Nhật Bản","Nhật đầu hàng Đồng minh"],3],

const L="ABCD",app=document.getElementById("app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q=[],i=0,score=0,total=0,answered=0;
function home(){
app.innerHTML=`<h1>Ôn tập Lịch sử 12</h1><p class="mute">Đề cương giữa học kì 1 · ${MC.length} câu trắc nghiệm · ${TF.length} câu đúng sai. Câu hỏi được xáo ngẫu nhiên.</p>
<button class="mode" data-m="all"><b>Tất cả</b><br><span class="mute">Trắc nghiệm và đúng sai trộn lẫn</span></button>
<button class="mode" data-m="mc"><b>Chỉ trắc nghiệm</b><br><span class="mute">${MC.length} câu, chọn A–D</span></button>
<button class="mode" data-m="tf"><b>Chỉ đúng sai</b><br><span class="mute">${TF.length} câu, mỗi câu 4 ý</span></button>`;
app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));}
function start(m){
Q=[];if(m!="tf")MC.forEach(q=>Q.push({t:"mc",q}));if(m!="mc")TF.forEach(q=>Q.push({t:"tf",q}));
Q=shuf(Q);i=0;score=0;total=0;show();}
function head(){return `<div class="top"><span>Câu ${i+1}/${Q.length}</span><span>Đúng: ${score}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div>`}
function nextBtn(){const b=document.createElement("button");b.className="main";b.textContent=i+1<Q.length?"Câu tiếp":"Xem kết quả";b.onclick=()=>{i++;i<Q.length?show():end()};app.appendChild(b);b.scrollIntoView({block:"nearest",behavior:"smooth"})}
function show(){
const it=Q[i];window.scrollTo(0,0);
if(it.t=="mc"){const [q,o,a]=it.q;
app.innerHTML=head()+`<div class="q"><b>Trắc nghiệm</b>${q}</div>`;
o.forEach((x,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=L[k]+". "+x;
b.onclick=()=>{app.querySelectorAll(".opt").forEach((e,n)=>{e.disabled=true;if(n==a)e.classList.add("ok")});
if(k==a){score++;}else b.classList.add("no");
const r=document.createElement("div");r.className="res "+(k==a?"ok":"no");r.textContent=k==a?"Chính xác!":"Sai. Đáp án đúng: "+L[a];app.appendChild(r);
app.firstChild.querySelector("span:last-child").textContent="Đúng: "+score;nextBtn()};app.appendChild(b)})}
else{const [q,s]=it.q;let n=0,c=0;
app.innerHTML=head()+`<div class="q"><b>Đúng sai · chọn Đúng hoặc Sai cho từng ý</b>${q}</div>`;
s.forEach((x,k)=>{const d=document.createElement("div");d.className="tf";
d.innerHTML=`<p>${"abcd"[k]}) ${x[0]}</p><div class="row"><button>Đúng</button><button>Sai</button></div>`;
const bs=d.querySelectorAll("button");
bs.forEach((b,v)=>b.onclick=()=>{const t=x[1]?0:1;bs.forEach(e=>e.disabled=true);bs[t].classList.add("ok");
const good=(v==0)==!!x[1];if(!good)b.classList.add("no");else c++;
d.classList.add(good?"ok":"no");const r=document.createElement("div");r.className="res "+(good?"ok":"no");
r.textContent=(good?"Chính xác. ":"Chưa đúng. ")+"Ý này "+(x[1]?"ĐÚNG":"SAI");d.appendChild(r);
if(++n==4){if(c==4)score++;nextBtn();app.firstChild.querySelector("span:last-child").textContent="Đúng: "+score}});
app.appendChild(d)})}}
function end(){app.innerHTML=`<h1>Hoàn thành</h1><div class="score">${score}/${Q.length}</div><p class="mute">Câu đúng sai chỉ tính điểm khi đúng cả 4 ý.</p><button class="main" id="r">Làm lại (xáo mới)</button><button class="mode" id="h">Về trang chọn chế độ</button>`;
document.getElementById("r").onclick=()=>{Q=shuf(Q);i=0;score=0;show()};document.getElementById("h").onclick=home}
home();
</script></body></html>
